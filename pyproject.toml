[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hades"
version = "0.1.0"
description = "Security Without Model Refusal — defense-in-depth lab for non-refusing enterprise RAG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sahil Seemant" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "PyJWT>=2.8.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.1",
  "numpy>=1.26.0",
  "python-multipart>=0.0.9",
  "typer>=0.12.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]
chromadb = [
  "chromadb>=0.5.0",
]

[project.scripts]
hades = "hades.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
